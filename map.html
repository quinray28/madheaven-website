<head>
  <title>Карта | MH</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="index,follow">
  <link rel="icon" href="media/telegram-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <style>
    html, body { height:100%; }
    body.map-page {
      display:flex; flex-direction:column;
      height:100vh; overflow:hidden;
      background:#000; margin:0;
    }
    body.map-page .header { flex:0 0 auto; }
    #map {
      position:relative; flex:1 1 auto; min-height:0;
      background:#000; overflow:hidden;
      cursor:grab; touch-action:none;
      user-select:none; -webkit-user-select:none;
    }
    #map.grabbing { cursor:grabbing; }
    #viewport {
      position:absolute; left:0; top:0;
      transform-origin:0 0; will-change:transform;
    }
    #map-image {
      display:block; max-width:none; max-height:none;
      pointer-events:none; -webkit-user-drag:none;
      user-select:none; background:#000;
    }
    #zoom-controls {
      position:fixed; right:16px; bottom:24px; z-index:40;
      display:flex; flex-direction:column;
      background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      background-color:rgba(8,8,10,0.8);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      border-radius:18px; overflow:hidden;
      box-shadow:0 18px 50px rgba(150,129,235,0.15);
    }
    #zoom-controls button {
      width:48px; height:48px; border:none; background:transparent;
      font-size:22px; cursor:pointer; color:rgba(255,255,255,0.85);
      font-family:'Jost', sans-serif; transition:background .2s ease;
    }
    #zoom-controls button:hover { background:rgba(255,255,255,0.07); color:#fff; }
    #zoom-controls button + button { border-top:1px solid rgba(255,255,255,0.1); }
    #zoom-label {
      text-align:center; font-size:12px; font-weight:700; padding:6px 0;
      border-top:1px solid rgba(255,255,255,0.1);
      background:linear-gradient(90deg, #9681eb 0%, #45cfdd 100%);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      min-width:48px;
    }
  </style>
</head>
<body class="gjs-t-body map-page">
  <header id="iz8el" class="header"><div id="ibwdh" class="header-container"><a href="index.html" class="gjs-link-box"><img src="media/MH.png" id="iljx42-2-3-2" alt="Mad Heaven"></a><nav id="i89uu" class="navigation"><a href="index.html#about" class="gjs-t-link link-hover nav-link">Об игре</a><a href="index.html#story" class="gjs-t-link link-hover nav-link">Сюжет</a><a href="news.html" class="gjs-t-link link-hover nav-link">Новости</a><a href="map.html" class="gjs-t-link link-hover nav-link map-btn" aria-current="page">Карта<span class="badge-new">Новое!</span></a><a href="index.html#faq" class="gjs-t-link link-hover nav-link">FAQ</a><a href="index.html#socials" class="gjs-t-button link-hover social-button">Наши соцсети</a></nav></div></header>

  <div id="map">
    <div id="viewport">
      <img id="map-image" src="media/map-image.jpg" alt="Карта острова Иней" draggable="false">
    </div>
  </div>

  <div id="zoom-controls" class="grad-border">
    <button id="zoomIn" title="Приблизить">+</button>
    <button id="zoomOut" title="Отдалить">−</button>
    <button id="fitBtn" title="Показать всё" style="font-size:17px;">⤢</button>
    <div id="zoom-label">100%</div>
  </div>

<script>
(function(){
  const container = document.getElementById('map');
  const viewport = document.getElementById('viewport');
  const img = document.getElementById('map-image');
  const zoomLabel = document.getElementById('zoom-label');

  const MAX_PERCENT = 600;
  const FIT_MARGIN = 0.94;

  let scale = 1, coverScale = 1, minScale = 1, maxScale = 6;
  let tx = 0, ty = 0;

  function apply(){
    viewport.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    const pct = Math.round(scale / coverScale * 100);
    zoomLabel.textContent = pct + '%';
  }

  function clampPan(){
    const iw = img.naturalWidth, ih = img.naturalHeight;
    if(!iw || !ih) return;
    const w = iw * scale, h = ih * scale;
    const cw = container.clientWidth, ch = container.clientHeight;
    if(w <= cw){ tx = (cw - w) / 2; }
    else { tx = Math.min(0, Math.max(cw - w, tx)); }
    if(h <= ch){ ty = (ch - h) / 2; }
    else { ty = Math.min(0, Math.max(ch - h, ty)); }
  }

  function recomputeCover(){
    const cw = container.clientWidth, ch = container.clientHeight;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    if(!iw || !ih) return;
    coverScale = Math.min(cw / iw, ch / ih) * FIT_MARGIN;
    minScale = coverScale;
    maxScale = coverScale * (MAX_PERCENT / 100);
  }

  function fitImage(){
    recomputeCover();
    scale = coverScale;
    const cw = container.clientWidth, ch = container.clientHeight;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    tx = (cw - iw * scale) / 2;
    ty = (ch - ih * scale) / 2;
    clampPan();
    apply();
  }

  function zoomAt(cx, cy, factor){
    const ns = Math.min(maxScale, Math.max(minScale, scale * factor));
    if(ns === scale) return;
    const k = ns / scale;
    tx = cx - (cx - tx) * k;
    ty = cy - (cy - ty) * k;
    scale = ns;
    clampPan();
    apply();
  }
  function zoomCenter(factor){
    zoomAt(container.clientWidth/2, container.clientHeight/2, factor);
  }

  const pointers = new Map();
  let lastPinchDist = 0, lastPinchCx = 0, lastPinchCy = 0;

  container.addEventListener('pointerdown', e => {
    container.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    container.classList.add('grabbing');
    if(pointers.size === 2){
      const p = [...pointers.values()];
      lastPinchDist = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      lastPinchCx = (p[0].x+p[1].x)/2;
      lastPinchCy = (p[0].y+p[1].y)/2;
    }
  });
  container.addEventListener('pointermove', e => {
    if(!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size === 1){
      tx += dx; ty += dy;
      clampPan();
      apply();
    } else if(pointers.size === 2){
      const p = [...pointers.values()];
      const dist = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      const cx = (p[0].x+p[1].x)/2, cy = (p[0].y+p[1].y)/2;
      tx += cx - lastPinchCx; ty += cy - lastPinchCy;
      if(lastPinchDist > 0){
        const ns = Math.min(maxScale, Math.max(minScale, scale * (dist / lastPinchDist)));
        const k = ns / scale;
        const rect = container.getBoundingClientRect();
        const lx = cx - rect.left, ly = cy - rect.top;
        tx = lx - (lx - tx) * k;
        ty = ly - (ly - ty) * k;
        scale = ns;
      }
      clampPan();
      apply();
      lastPinchDist = dist; lastPinchCx = cx; lastPinchCy = cy;
    }
  });
  function endPointer(e){
    pointers.delete(e.pointerId);
    if(pointers.size === 0) container.classList.remove('grabbing');
    lastPinchDist = 0;
  }
  container.addEventListener('pointerup', endPointer);
  container.addEventListener('pointercancel', endPointer);

  container.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0015);
    const rect = container.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, factor);
  }, {passive:false});

  container.addEventListener('dblclick', e => {
    const rect = container.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, 1.6);
  });

  document.getElementById('zoomIn').onclick = () => zoomCenter(1.4);
  document.getElementById('zoomOut').onclick = () => zoomCenter(1/1.4);
  document.getElementById('fitBtn').onclick = () => fitImage();

  if(img.complete && img.naturalWidth){ fitImage(); }
  else { img.addEventListener('load', fitImage); }
  window.addEventListener('resize', () => {
    const wasAtMin = Math.abs(scale - minScale) < 0.0001;
    const oldCover = coverScale;
    recomputeCover();
    if(wasAtMin || scale < minScale){ scale = coverScale; }
    else {
      const rel = scale / oldCover;
      scale = Math.min(maxScale, Math.max(minScale, coverScale * rel));
    }
    clampPan();
    apply();
  });
})();
</script>
</body>
</html>
